name: Test dry-run with v prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity and set up local origin with v-prefixed tag
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a baseline v-prefixed semver tag
          git tag v1.0.0
          # Set up a local bare repo as origin so git fetch --tags works
          # (per_branch mode uses git fetch --tags instead of the GitHub API)
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          bump: minor
          dry_run: "true"
          per_branch: "true"
          prefix: "v"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          # version (without prefix) should be a semver like X.Y.Z
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: version '$VERSION' does not look like a semver"
            exit 1
          fi
          # minor bump from v1.0.0 should yield 1.1.0
          if [ "$VERSION" != "1.1.0" ]; then
            echo "FAIL: expected version '1.1.0' but got '$VERSION'"
            exit 1
          fi
          echo "PASS: version is '$VERSION'"

      - name: Assert version_tag has v prefix
        env:
          VERSION_TAG: ${{ steps.action.outputs.version_tag }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version_tag: $VERSION_TAG"
          echo "version: $VERSION"
          if [ -z "$VERSION_TAG" ]; then
            echo "FAIL: version_tag output is empty"
            exit 1
          fi
          # version_tag should start with 'v'
          if ! echo "$VERSION_TAG" | grep -qE '^v'; then
            echo "FAIL: version_tag '$VERSION_TAG' does not start with 'v'"
            exit 1
          fi
          # version_tag should equal 'v' + version
          EXPECTED="v${VERSION}"
          if [ "$VERSION_TAG" != "$EXPECTED" ]; then
            echo "FAIL: expected version_tag '$EXPECTED' but got '$VERSION_TAG'"
            exit 1
          fi
          echo "PASS: version_tag is '$VERSION_TAG'"
