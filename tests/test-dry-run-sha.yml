name: Test dry-run with sha input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get current commit SHA
        id: get-sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Current SHA: $SHA"

      - id: action
        uses: .
        with:
          bump: patch
          dry_run: true
          github_token: ${{ github.token }}
          sha: ${{ steps.get-sha.outputs.sha }}

      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
          VERSION_TAG: ${{ steps.action.outputs.version_tag }}
        run: |
          echo "version: $VERSION"
          echo "version_tag: $VERSION_TAG"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION version_tag=$VERSION_TAG"
