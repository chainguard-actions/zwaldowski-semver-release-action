name: Test dry-run major bump from existing tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git and create a baseline tag with local origin
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a baseline semver tag so the action has something to increment from
          git tag 1.2.3
          # Set up a local bare repo as origin so git fetch --tags works
          # (per_branch mode uses git fetch --tags instead of the GitHub API)
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          bump: major
          dry_run: "true"
          per_branch: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert version is incremented major from 1.2.3
        env:
          VERSION: ${{ steps.action.outputs.version }}
          VERSION_TAG: ${{ steps.action.outputs.version_tag }}
          VERSION_OPT: ${{ steps.action.outputs.version_optimistic }}
        run: |
          echo "version: $VERSION"
          echo "version_tag: $VERSION_TAG"
          echo "version_optimistic: $VERSION_OPT"

          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi

          # major bump from 1.2.3 should yield 2.0.0
          if [ "$VERSION" != "2.0.0" ]; then
            echo "FAIL: expected version '2.0.0' but got '$VERSION'"
            exit 1
          fi
          echo "PASS: version is '$VERSION'"

          # version_tag should equal version (no prefix)
          if [ "$VERSION_TAG" != "2.0.0" ]; then
            echo "FAIL: expected version_tag '2.0.0' but got '$VERSION_TAG'"
            exit 1
          fi
          echo "PASS: version_tag is '$VERSION_TAG'"

          # version_optimistic should be major.minor = 2.0
          if [ "$VERSION_OPT" != "2.0" ]; then
            echo "FAIL: expected version_optimistic '2.0' but got '$VERSION_OPT'"
            exit 1
          fi
          echo "PASS: version_optimistic is '$VERSION_OPT'"
