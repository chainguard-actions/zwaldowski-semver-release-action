name: Test dry-run prerelease bump with preid
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity and set up local origin
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a baseline semver tag
          git tag 1.0.0
          # Set up a local bare repo as origin so git fetch --tags works
          # (per_branch mode uses git fetch --tags instead of the GitHub API)
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          bump: prerelease
          dry_run: "true"
          per_branch: "true"
          preid: "alpha"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert version contains preid
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          # prerelease version should contain the preid 'alpha'
          if ! echo "$VERSION" | grep -q 'alpha'; then
            echo "FAIL: version '$VERSION' does not contain preid 'alpha'"
            exit 1
          fi
          echo "PASS: version '$VERSION' contains preid 'alpha'"

      - name: Assert version_optimistic output is set
        env:
          VERSION_OPT: ${{ steps.action.outputs.version_optimistic }}
        run: |
          echo "version_optimistic: $VERSION_OPT"
          if [ -z "$VERSION_OPT" ]; then
            echo "FAIL: version_optimistic output is empty"
            exit 1
          fi
          echo "PASS: version_optimistic is '$VERSION_OPT'"

      - name: Assert version_tag output is set
        env:
          VERSION_TAG: ${{ steps.action.outputs.version_tag }}
        run: |
          echo "version_tag: $VERSION_TAG"
          if [ -z "$VERSION_TAG" ]; then
            echo "FAIL: version_tag output is empty"
            exit 1
          fi
          echo "PASS: version_tag is '$VERSION_TAG'"
