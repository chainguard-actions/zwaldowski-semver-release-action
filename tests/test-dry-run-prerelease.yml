name: Test dry-run prerelease bump with preid
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set VERSION env to bypass the repo-scoped API call for listing tags.
      # The action checks env.VERSION first and skips getMostRecentRepoTag() if set.
      - id: action
        uses: .
        env:
          VERSION: "3.0.0-beta.1"
        with:
          bump: prerelease
          dry_run: "true"
          preid: "beta"
          prefix: "v"
          github_token: ${{ github.token }}

      - name: Assert version output is a prerelease
        env:
          VERSION_OUT: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION_OUT"
          if [ "$VERSION_OUT" != "3.0.0-beta.1" ]; then
            echo "FAIL: expected version '3.0.0-beta.1', got '$VERSION_OUT'"
            exit 1
          fi
          echo "PASS"

      - name: Assert version_tag has prefix
        env:
          VERSION_TAG: ${{ steps.action.outputs.version_tag }}
        run: |
          echo "version_tag: $VERSION_TAG"
          if [ "$VERSION_TAG" != "v3.0.0-beta.1" ]; then
            echo "FAIL: expected version_tag 'v3.0.0-beta.1', got '$VERSION_TAG'"
            exit 1
          fi
          echo "PASS"

      - name: Assert version_optimistic output
        env:
          VERSION_OPT: ${{ steps.action.outputs.version_optimistic }}
        run: |
          echo "version_optimistic: $VERSION_OPT"
          if [ "$VERSION_OPT" != "3.0" ]; then
            echo "FAIL: expected version_optimistic '3.0', got '$VERSION_OPT'"
            exit 1
          fi
          echo "PASS"
