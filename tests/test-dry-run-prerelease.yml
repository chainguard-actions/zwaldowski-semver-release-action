name: Test dry-run prerelease bump with preid
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          bump: prerelease
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
          preid: "alpha"
          per_branch: true

      - name: Assert prerelease version output contains preid
        env:
          VERSION: ${{ steps.action.outputs.version }}
          VERSION_TAG: ${{ steps.action.outputs.version_tag }}
        run: |
          echo "version: $VERSION"
          echo "version_tag: $VERSION_TAG"

          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi

          # Prerelease version should contain the preid "alpha"
          if ! echo "$VERSION" | grep -q "alpha"; then
            echo "FAIL: version '$VERSION' does not contain preid 'alpha'"
            exit 1
          fi

          # Prerelease version should match semver pre-release format
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+'; then
            echo "FAIL: version '$VERSION' does not match expected prerelease format X.Y.Z-alpha.N"
            exit 1
          fi

          echo "PASS: version=$VERSION version_tag=$VERSION_TAG"
