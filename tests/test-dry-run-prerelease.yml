name: Test dry-run prerelease bump with preid
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config, initial tag, and local origin
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create an initial version tag
          git tag 1.2.3
          # Set up a local bare repo as origin so git fetch --tags works
          rm -rf /tmp/test-semver-prerelease-remote
          git init --bare /tmp/test-semver-prerelease-remote
          git push /tmp/test-semver-prerelease-remote HEAD:refs/heads/act-harness
          git push /tmp/test-semver-prerelease-remote --tags
          git remote set-url origin /tmp/test-semver-prerelease-remote 2>/dev/null || \
            git remote add origin /tmp/test-semver-prerelease-remote

      - id: action
        uses: .
        with:
          bump: prerelease
          preid: alpha
          dry_run: true
          per_branch: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version is '$VERSION'"

      - name: Assert version contains alpha preid
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if ! echo "$VERSION" | grep -q "alpha"; then
            echo "FAIL: expected version to contain 'alpha' but got '$VERSION'"
            exit 1
          fi
          echo "PASS: version contains 'alpha'"

      - name: Assert version_tag is set
        env:
          VERSION_TAG: ${{ steps.action.outputs.version_tag }}
        run: |
          echo "version_tag: $VERSION_TAG"
          if [ -z "$VERSION_TAG" ]; then
            echo "FAIL: version_tag output is empty"
            exit 1
          fi
          echo "PASS: version_tag is '$VERSION_TAG'"

      - name: Assert version_optimistic is set
        env:
          VERSION_OPTIMISTIC: ${{ steps.action.outputs.version_optimistic }}
        run: |
          echo "version_optimistic: $VERSION_OPTIMISTIC"
          if [ -z "$VERSION_OPTIMISTIC" ]; then
            echo "FAIL: version_optimistic output is empty"
            exit 1
          fi
          echo "PASS: version_optimistic is '$VERSION_OPTIMISTIC'"
